<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Harvest Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: the world canvas fills the screen; wooden HUD pieces float at the edges
   (stats top, goal card left, context panel right / bottom sheet on phones, task queue bottom).
   Single committed look: dusk-green field under warm timber panels. */
:root {
  color-scheme: dark;
  --field: #1e3a30;        /* beyond-the-map ground */
  --wood: #3a2416;         /* panel body */
  --wood-hi: #5a3a22;      /* panel rim / rows */
  --wood-lo: #24160d;      /* insets, shadows */
  --paper: #f6e7c1;        /* primary text */
  --paper-dim: #c9b48a;    /* secondary text */
  --sun: #f5c542;          /* accent: actions, gold */
  --leaf: #8fd05a;         /* good / done */
  --berry: #e0485e;        /* warnings */
  --sky: #8fd3ef;          /* tasks, water */
  --plum: #b48ae8;         /* discovery */
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --r: 3px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--field); color: var(--paper); font-family: var(--f-body); font-weight: 600; font-size: 14px; text-rendering: optimizeLegibility; overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: relative; height: 100%; overflow: hidden; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; image-rendering: pixelated; }
#world.panning { cursor: grabbing; }
#world.rotating { cursor: ew-resize; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.wood { background: var(--wood); border: 2px solid var(--wood-lo); box-shadow: inset 0 0 0 2px var(--wood-hi), 0 4px 0 rgba(0,0,0,.35); border-radius: var(--r); }
.eyebrow { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--paper-dim); margin: 14px 0 6px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; line-height: 1.1; text-wrap: balance; color: var(--paper); }
.sub, .hint, .tip { color: var(--paper-dim); line-height: 1.45; margin: 6px 0; }
.tip { font-size: 12px; border-top: 1px dashed var(--wood-hi); padding-top: 8px; margin-top: 14px; }
.muted { color: var(--paper-dim); font-size: 12px; }
.warn { color: var(--berry); font-weight: 700; }
.ok { color: var(--leaf); }
.ico { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; flex: none; }
.ico.big { width: 40px; height: 40px; }
.ico.dim { opacity: .45; filter: grayscale(.8); }

/* top bar */
#top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
#stats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 0 1 auto; min-width: 0; }
#stats > *, #topbtns > * { pointer-events: auto; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; background: var(--wood); border: 2px solid var(--wood-lo); box-shadow: inset 0 0 0 2px var(--wood-hi), 0 3px 0 rgba(0,0,0,.35); border-radius: var(--r); font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--f-display); font-size: 19px; font-weight: 600; line-height: 1; }
.stat .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--paper-dim); }
.coin { width: 12px; height: 12px; background: var(--sun); box-shadow: inset -2px -2px 0 #c9902a, 0 0 0 2px #7a4b18; border-radius: 1px; align-self: center; }
.stat:first-child b { color: var(--sun); }
.stat.disc, .stat.store { cursor: pointer; }
.stat.disc b { color: var(--plum); }
.stat.disc.ping { animation: ping 1.4s ease-in-out infinite; }
@keyframes ping { 50% { box-shadow: inset 0 0 0 2px var(--plum), 0 3px 0 rgba(0,0,0,.35), 0 0 12px rgba(180,138,232,.7); } }
.stat.time b { font-size: 16px; }
/* seasons: the day chip opens the seasons drawer and carries today's weather */
.stat.season { cursor: pointer; align-items: center; }
.stat.season:hover { box-shadow: inset 0 0 0 2px var(--sun), 0 3px 0 rgba(0,0,0,.35); }
.stat.season.spring { border-color: #3d6a2a; } .stat.season.summer { border-color: #7a6a18; } .stat.season.autumn { border-color: #8a3e18; } .stat.season.winter { border-color: #4a6a8a; }
.wxtag { font-family: var(--f-display); font-size: 12px; font-weight: 600; line-height: 1; padding: 3px 6px; border-radius: 99px; background: #f6e7c1; color: #3a2416; white-space: nowrap; }
.wxtag.wx-rain { background: #8fc4ea; color: #12304a; } .wxtag.wx-sun { background: #f5d25a; color: #4a3208; } .wxtag.wx-heat { background: #f29a5a; color: #4a1a06; }
.wxtag.wx-snow, .wxtag.wx-frost { background: #e4eef6; color: #1e3448; } .wxtag.wx-mist, .wxtag.wx-fog { background: #c8ccd0; color: #262c32; }
.wxrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.wxcard { background: var(--wood-lo); border: 1px solid var(--wood-hi); border-left: 4px solid #f6e7c1; border-radius: var(--r); padding: 4px 10px 8px; }
.wxcard .eyebrow { margin: 4px 0 2px; } .wxcard b { font-family: var(--f-display); font-size: 18px; } .wxcard p { margin: 4px 0 0; font-size: 13px; line-height: 1.4; color: var(--paper-dim); }
.wxcard.wx-rain { border-left-color: #8fc4ea; } .wxcard.wx-sun { border-left-color: #f5d25a; } .wxcard.wx-heat { border-left-color: #f29a5a; } .wxcard.wx-snow, .wxcard.wx-frost { border-left-color: #e4eef6; } .wxcard.wx-mist, .wxcard.wx-fog { border-left-color: #a8b0b6; }
.sitems { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
.sitem { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 4px; background: var(--wood-lo); border: 1px solid var(--wood-hi); border-radius: 99px; font-size: 13px; }
.sitem.unk { color: var(--paper-dim); }
.yearbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.ys { position: relative; overflow: hidden; padding: 6px 8px; border-radius: var(--r); background: var(--wood-lo); border: 1px solid var(--wood-hi); border-top: 4px solid; }
.ys b { display: block; font-family: var(--f-display); font-size: 14px; } .ys small { color: var(--paper-dim); font-size: 11px; }
.ys.spring { border-top-color: #8fd05a; } .ys.summer { border-top-color: #f5d25a; } .ys.autumn { border-top-color: #e0803a; } .ys.winter { border-top-color: #b8d4ea; }
.ys.on { background: #4a3020; box-shadow: inset 0 0 0 1px var(--sun); }
.ys i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--sun); }
.ins { font-weight: 800; font-size: 12px; color: var(--leaf); margin-left: 4px; }
@media (max-width: 520px) { .wxrow { grid-template-columns: 1fr; } .yearbar { grid-template-columns: 1fr 1fr; } }
.status { align-self: center; font-size: 12px; color: var(--paper); background: rgba(20,12,8,.55); padding: 4px 10px; border-radius: 99px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbtns { display: flex; gap: 6px; }
.ibtn { cursor: pointer; padding: 8px 12px; font-family: var(--f-display); font-size: 15px; background: var(--wood); border: 2px solid var(--wood-lo); box-shadow: inset 0 0 0 2px var(--wood-hi), 0 3px 0 rgba(0,0,0,.35); border-radius: var(--r); }
.ibtn:hover { box-shadow: inset 0 0 0 2px var(--sun), 0 3px 0 rgba(0,0,0,.35); }

/* goal card */
#goals { position: absolute; left: 10px; top: 66px; width: 270px; padding: 10px 14px 12px; background: #f6e7c1; color: #3a2416; border: 2px solid #24160d; box-shadow: inset 0 0 0 2px #e2cc98, 0 4px 0 rgba(0,0,0,.35); border-radius: var(--r); }
#goals .goalhead { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; }
#goals .gctl { display: flex; gap: 4px; margin-right: -6px; }
#goals .gbtn { cursor: pointer; width: 26px; height: 24px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: #8a6236; font-family: var(--f-display); font-size: 17px; line-height: 1; }
#goals .gbtn:hover { background: #e2cc98; color: #3a2416; }
.stat.goalbtn { cursor: pointer; max-width: 230px; background: #f6e7c1; border-color: #24160d; box-shadow: inset 0 0 0 2px #e2cc98, 0 3px 0 rgba(0,0,0,.35); }
.stat.goalbtn .lbl { color: #8a6236; } .stat.goalbtn b { color: #3a2416; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stat.goalbtn:hover { box-shadow: inset 0 0 0 2px #8a6236, 0 3px 0 rgba(0,0,0,.35); }
#goals .eyebrow { color: #8a6236; margin: 0; }
#goals .chev { font-family: var(--f-display); font-size: 18px; color: #8a6236; }
.goaltitle { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin-top: 2px; text-wrap: balance; }
#goals p { margin: 6px 0 8px; line-height: 1.45; font-size: 13px; color: #5a3a22; }
.steps { display: flex; gap: 3px; }
.steps i { flex: 1; height: 5px; background: #e2cc98; }
.steps i.on { background: #6fa83a; }
.steps i.now { background: #e8a030; }

/* context panel */
#panel { position: absolute; right: 10px; top: 66px; max-height: calc(100% - 140px); width: 350px; overflow-y: auto; padding: 14px 16px 16px; overscroll-behavior: contain; }
.phead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.phead .sub { margin-top: 4px; font-size: 13px; }
.close { cursor: pointer; flex: none; width: 30px; height: 30px; background: var(--wood-lo); border: 0; border-radius: var(--r); font-size: 20px; line-height: 1; color: var(--paper-dim); }
.close:hover { color: var(--paper); }
.state { margin: 12px 0 8px; }
.row { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
.grow1 { flex: 1; min-width: 0; }
.grow1 small { display: block; color: var(--paper-dim); font-size: 12px; margin-top: 2px; }
.pb { height: 8px; background: var(--wood-lo); margin-top: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.pb i { display: block; height: 100%; width: 0; background: var(--leaf); }
.pb.thin { height: 4px; }
.slots .pb i { background: #f0a030; }

.btn { cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; width: 100%; margin: 6px 0; padding: 9px 12px; text-align: left; font-weight: 800; background: var(--wood-hi); color: var(--paper); border: 2px solid var(--wood-lo); border-radius: var(--r); box-shadow: 0 3px 0 var(--wood-lo); }
.btn > img { display: none; }
.btn:hover:not(:disabled) { background: #6b4628; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-lo); }
.btn small { font-weight: 500; font-size: 12px; color: var(--paper-dim); }
.btn.pri { background: var(--sun); color: #3a2416; }
.btn.pri small { color: #6b4a1a; }
.btn.pri:hover:not(:disabled) { background: #ffd65e; }
.btn:disabled { cursor: not-allowed; background: #2e1d12; color: #8a7a5e; box-shadow: none; }
.btn:disabled small { color: #b0806a; }
.btn.ghost { background: transparent; border-color: var(--wood-hi); box-shadow: none; }
.btn.danger { background: var(--berry); color: #fff; }
.btn.sm { width: auto; margin: 0; padding: 6px 10px; font-size: 13px; flex: none; align-items: center; }
.btn.sm small { display: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.grid2 .btn { flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: 6px; }
.grid2 .btn > img { display: inline; width: 20px; height: 20px; }
.grid2 .btn small { flex-basis: 100%; }
.check { display: flex; gap: 8px; align-items: center; margin: 8px 0; color: var(--paper); font-size: 13px; }
.check input { accent-color: var(--sun); width: 16px; height: 16px; }

.recipe { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px; margin: 6px 0; background: rgba(0,0,0,.18); border-radius: var(--r); }
.recipe .btn { width: auto; margin: 0; flex: none; padding: 7px 12px; }
.recipe .btn small { display: none; }
.ldb { display: flex; flex-direction: column; gap: 4px; flex: none; } .ldb .btn { width: 100%; justify-content: center; align-items: center; }
.rname { display: block; font-size: 13px; margin-bottom: 2px; }
.why { display: block; color: var(--paper-dim); font-size: 11px; margin-top: 2px; }
.recipe small.cost { white-space: normal; display: block; color: var(--sun); font-size: 12px; font-weight: 700; margin-top: 3px; }
.why.short { color: #e88a8a; }
.recipe.locked { color: var(--paper-dim); flex-wrap: wrap; }
.recipe.locked small { font-size: 12px; }
.formula { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; font-family: var(--f-display); font-size: 15px; min-width: 0; }
.formula .in small { font-family: var(--f-body); font-size: 11px; color: var(--paper-dim); margin-left: 2px; }
.formula .in.short small { color: var(--berry); }
.formula .plus, .formula .arrow { color: var(--paper-dim); margin: 0 3px; }
.formula .muted { margin-left: 8px; font-family: var(--f-body); }

.q { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 99px; vertical-align: 1px; }
.q1 { background: #3e6b2a; color: #d6f5b8; }
.q2 { background: #6b4a9a; color: #f0e2ff; }

.tabs { display: flex; gap: 4px; margin: 12px 0 8px; }
.tab { cursor: pointer; flex: 1; padding: 7px 0; font-family: var(--f-display); font-size: 15px; background: var(--wood-lo); border: 0; border-radius: var(--r); color: var(--paper-dim); }
.tab.on { background: var(--wood-hi); color: var(--paper); box-shadow: inset 0 -3px 0 var(--sun); }
.trade { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed rgba(201,180,138,.18); }
.demand { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 8px 10px; background: rgba(245,197,66,.14); border: 1px solid rgba(245,197,66,.4); border-radius: var(--r); font-size: 13px; }

.order { padding: 10px 12px; margin: 10px 0; background: rgba(0,0,0,.18); border-radius: var(--r); }
.order.ms { background: rgba(180,138,232,.12); border: 1px solid rgba(180,138,232,.45); }
.order.ms .eyebrow { color: var(--plum); }
.otop .eyebrow { margin: 0 0 2px; }
.otop b { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.need { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.need span { flex: 1; min-width: 0; }
.need b { font-variant-numeric: tabular-nums; color: var(--paper-dim); }
.need.ok b { color: var(--leaf); }
.need em { font-style: normal; color: var(--leaf); font-weight: 800; }
.need .new { flex: none; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--plum); border: 1px solid var(--plum); padding: 0 5px; border-radius: 99px; }
.oreward { font-weight: 800; color: var(--sun); font-size: 13px; margin: 6px 0 2px; }
.obtns { display: flex; gap: 8px; align-items: center; }
.obtns .btn.pri { flex: 1; }

.field { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--paper-dim); }
.field input { flex: 1; min-width: 0; padding: 7px 9px; background: var(--wood-lo); color: var(--paper); border: 1px solid var(--wood-hi); border-radius: var(--r); font: inherit; }
.swatches { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--paper-dim); }
.swatches span { width: 44px; }
.sw { cursor: pointer; width: 24px; height: 24px; border: 2px solid var(--wood-lo); border-radius: 2px; }
.sw.on { box-shadow: 0 0 0 2px var(--sun); }

/* task queue */
#queue { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; max-width: calc(100% - 140px); flex-wrap: wrap; justify-content: center; pointer-events: none; }
.chip { pointer-events: auto; display: flex; gap: 6px; align-items: center; padding: 6px 6px 6px 12px; background: rgba(36,22,13,.88); border: 2px solid var(--wood-lo); border-radius: var(--r); font-size: 13px; font-weight: 700; color: var(--paper); }
.chip.cur { box-shadow: inset 0 0 0 2px var(--sky); flex-direction: column; align-items: stretch; padding: 6px 12px; min-width: 150px; }
.chip.cur .pb { margin-top: 2px; }
.chip.cur .pb i { background: var(--sky); }
.chip.idle { font-weight: 500; color: var(--paper-dim); padding: 6px 12px; }
.chip .x { cursor: pointer; width: 22px; height: 22px; border: 0; border-radius: 2px; background: var(--wood-hi); color: var(--paper); font-size: 15px; line-height: 1; }

#zoom { position: absolute; left: 10px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
#zoom .ibtn { width: 40px; height: 40px; padding: 0; font-size: 20px; }

/* toasts */
#toasts { position: absolute; top: 66px; left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { padding: 9px 14px; background: rgba(36,22,13,.94); border-left: 4px solid var(--sky); border-radius: var(--r); font-size: 13px; line-height: 1.4; box-shadow: 0 3px 0 rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast b { color: var(--paper); }
.toast.disc { border-left-color: var(--plum); }
.toast.goal { border-left-color: var(--leaf); }
.toast.warn { border-left-color: var(--berry); }
.toast .where { display: block; color: var(--sun); margin-top: 3px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* drawer */
#drawer { position: absolute; inset: 0; z-index: 30; background: rgba(15,10,6,.55); display: grid; place-items: center; padding: 70px 16px 16px; }
.dbox { width: min(720px, 100%); max-height: 100%; overflow-y: auto; padding: 16px 18px 20px; background: var(--wood); border: 2px solid var(--wood-lo); box-shadow: inset 0 0 0 2px var(--wood-hi), 0 6px 0 rgba(0,0,0,.4); border-radius: var(--r); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 14px; }
.card { padding: 12px; background: rgba(0,0,0,.2); border-radius: var(--r); border: 1px solid transparent; display: flex; flex-direction: column; }
.card p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; }
.card .where { color: var(--sun); font-size: 12px; }
.card small { margin-top: 8px; color: var(--paper-dim); font-size: 12px; }
.card .btn { margin-top: auto; margin-bottom: 0; }
.card p + .btn, .card .where + .btn { margin-top: 10px; }
.card.own { border-color: rgba(143,208,90,.5); }
.card.own .cost { color: var(--leaf); }
.card.can { border-color: var(--plum); }
.card.lock { opacity: .6; }
.ctop { display: flex; gap: 12px; align-items: center; }
.ctop .ctxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dimg { width: 72px; height: 84px; flex: none; image-rendering: pixelated; background: radial-gradient(ellipse at 50% 70%, rgba(143,208,90,.16), transparent 70%); border-radius: var(--r); }
.card.lock .dimg { filter: grayscale(.9) brightness(.8); }
.card.own .dimg { background: radial-gradient(ellipse at 50% 70%, rgba(245,197,66,.18), transparent 70%); }
.ctop b { font-family: var(--f-display); font-size: 16px; font-weight: 600; line-height: 1.2; }
.card .cost { font-family: var(--f-display); color: var(--plum); white-space: nowrap; }
.invgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 14px; }
.slot { display: flex; gap: 10px; align-items: center; padding: 8px; background: rgba(0,0,0,.2); border-radius: var(--r); }
.slot small { display: block; color: var(--paper-dim); font-size: 12px; }
small.use { display: block; color: var(--sun); font-size: 11.5px; margin-top: 2px; line-height: 1.35; }
.trade .grow1 small.use { font-size: 11.5px; }
.menu { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.menu .btn { width: auto; }
.help { margin: 0; padding-left: 18px; line-height: 1.6; color: var(--paper-dim); }
.code { box-sizing: border-box; width: 100%; padding: 8px 10px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--paper); background: var(--wood-lo); border: 1px solid var(--wood-hi); border-radius: var(--r); resize: vertical; word-break: break-all; }
.hint.err { color: #e88a8a; }
.help.desk { display: none; } /* desktop controls, hidden on touch screens */
.linkish.small { display: inline-block; margin: 8px 0 2px; font-size: 12.5px; color: var(--paper-dim); text-decoration: underline; text-underline-offset: 3px; }


/* sell by amount */
.trade.sell { flex-wrap: wrap; }
.sellctl { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-left: 32px; }
.qtybox { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
.sellctl .btn { flex-direction: row; white-space: nowrap; }
.trade.sell { padding: 9px 0; row-gap: 6px; }
